<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Raster fallback: Safari and some Android browsers ignore an SVG favicon. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />

    <!-- Home-screen icon. iOS reads ONLY apple-touch-icon (never the SVG favicon and
         never the manifest), so without this line it invents a grey tile with the first
         letter of the title — which is exactly what "Add to Home Screen" produced. The
         PNG is deliberately full-bleed white: iOS applies its own squircle mask and
         ignores the artwork's own rounded corners, so padding it with anything other
         than the card colour would show as grey corners. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The label under the icon. Without this iOS uses <title>, which is too long and
         showed as "E…Dashboard" on the home screen. -->
    <meta name="apple-mobile-web-app-title" content="Nazorat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f3d2e" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etihad Dashboard</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
